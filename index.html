<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BrewOps | brew.oening.com.br</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BrewOps">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>☕</text></svg>">

    <style>
        :root {
            --bg: #0a0a0a;
            --card: #161616;
            --text: #efefef;
            --dim: #888;
            --accent: #d4a373; 
            --border: #222;
            --alert: #ff4d4d;
            --success: #2d6a4f;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px 40px 20px;
            transition: background-color 0.3s;
        }

        body.warning-mode { background-color: #2a0a0a; }
        body.finish-mode { background-color: #0a2a1a; }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-top: 10px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .warning-mode .container { border-color: var(--alert); }
        .finish-mode .container { border-color: var(--success); }

        header { text-align: center; margin-bottom: 25px; }
        h2 { color: var(--accent); margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand { font-size: 0.7rem; color: var(--dim); letter-spacing: 1.5px; text-transform: lowercase; margin-top: 4px; display: block; font-weight: 500; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }

        select, input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #1e1e1e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        
        button { padding: 18px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-calc { background-color: var(--accent); color: #000; }
        .btn-clear { background-color: #2a2a2a; color: var(--dim); }

        .timer-display { text-align: center; font-size: 4.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; color: var(--accent); margin: 10px 0; font-weight: 800; letter-spacing: -2px; }
        .warning-mode .timer-display { color: var(--alert); animation: pulse 0.5s infinite alternate; }
        .finish-mode .timer-display { color: #4ade80; }

        @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

        .timer-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .btn-timer { padding: 12px; font-size: 0.8rem; background: #222; color: #fff; border: 1px solid var(--border); border-radius: 10px; }
        .btn-timer.active { background: var(--accent); color: #000; border: none; }

        #results { margin-top: 30px; display: none; border-top: 1px solid var(--border); padding-top: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .item { background: #1e1e1e; padding: 14px; border-radius: 14px; text-align: center; border: 1px solid #252525; }
        .item span { display: block; font-size: 0.6rem; color: var(--dim); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
        .item strong { font-size: 1.2rem; color: var(--accent); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.7rem; color: var(--dim); padding-bottom: 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 14px 0; border-bottom: 1px solid #222; font-size: 1rem; }
        .val { font-weight: 700; color: var(--accent); text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>BrewOps</h2>
        <span class="brand">brew.oening.com.br</span>
    </header>

    <div class="form-group">
        <label>Método de Extração</label>
        <select id="method" onchange="updateDefaultRatio()">
            <option value="v60">V60 (Hario)</option>
            <option value="french">Prensa Francesa</option>
        </select>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Água (ml)</label>
            <input type="number" id="volume" placeholder="Ex: 450" inputmode="numeric" oninput="onVolumeInput()">
        </div>
        <div class="form-group">
            <label>Café (g)</label>
            <input type="number" id="coffee" placeholder="Ex: 28" inputmode="decimal" step="0.5" oninput="onCoffeeInput()">
        </div>
        <div class="form-group">
            <label>Ratio (1:X)</label>
            <input type="number" id="ratio" inputmode="decimal" step="0.1" oninput="onRatioInput()">
        </div>
    </div>

    <div class="button-group">
        <button class="btn-calc" onclick="calculate()">Calcular</button>
        <button class="btn-clear" onclick="clearAll()">Limpar</button>
    </div>

    <div id="results">
        <div class="timer-display" id="display">00:00</div>
        <div class="timer-controls">
            <button class="btn-timer" id="startBtn" onclick="toggleTimer()">Iniciar</button>
            <button class="btn-timer" onclick="pauseTimer()">Pausar</button>
            <button class="btn-timer" onclick="resetTimer()">Zerar</button>
        </div>

        <div class="grid">
            <div class="item"><span>Café Moído</span><strong id="r-coffee">-</strong></div>
            <div class="item"><span>Timemore C3</span><strong id="r-grind">-</strong></div>
            <div class="item"><span>Temp. Ideal</span><strong id="r-temp">-</strong></div>
            <div class="item"><span>Tempo Alvo</span><strong id="r-time">-</strong></div>
        </div>

        <label style="font-size: 0.7rem; margin-bottom: 10px; display: block; color: var(--accent)">Escala de Vertidas (Acumulado)</label>
        <table>
            <thead><tr><th>Etapa</th><th style="text-align: right;">Balança</th></tr></thead>
            <tbody id="r-table"></tbody>
        </table>
    </div>
</div>

<script>
    const CONFIG = {
        v60: { 
            defaultRatio: 16, grind: "16 clks", temp: "93°C", time: "4:30", 
            targets: [30, 90, 145], 
            finalSeconds: 270, // 4:30
            getSteps: (v, coffee) => [
                { t: "0:00 (Bloom)", val: Math.round(coffee * 2.5) },
                { t: "0:30 (Vertida 2)", val: Math.round(v * 0.45) },
                { t: "1:30 (Vertida 3)", val: Math.round(v * 0.75) },
                { t: "2:25 (Finalizar)", val: v }
            ]
        },
        french: { 
            defaultRatio: 13, grind: "23 clks", temp: "91°C", time: "4:00", 
            targets: [30], 
            finalSeconds: 240, // 4:00
            getSteps: (v, coffee) => [
                { t: "0:00 (Início 50%)", val: Math.round(v * 0.50) },
                { t: "0:30 (Completar)", val: v }
            ]
        }
    };

    let audioCtx = null;
    let timer, seconds = 0, isRunning = false;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 2800, duration = 0.2, volume = 1.0) {
        if (!audioCtx) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Alarme de Finalização (3 bips rápidos)
    function playFinishAlarm() {
        playBeep(1500, 0.3, 1.0);
        setTimeout(() => playBeep(1500, 0.3, 1.0), 400);
        setTimeout(() => playBeep(1500, 0.5, 1.0), 800);
    }

    function keepAudioAlive() {
        if (isRunning && audioCtx) playBeep(440, 0.001, 0.001);
    }

    function toggleTimer() {
        initAudio();
        if (!isRunning) {
            isRunning = true;
            document.getElementById('startBtn').innerText = "Rodando";
            document.getElementById('startBtn').classList.add('active');
            playBeep(440, 0.05, 0.5); 
            timer = setInterval(tick, 1000);
        }
    }

    function tick() {
        seconds++;
        updateDisplay();
        checkAlerts();
        if (seconds % 10 === 0) keepAudioAlive();
    }

    function checkAlerts() {
        const mKey = document.getElementById('method').value;
        const conf = CONFIG[mKey];
        
        // Alerta de Finalização Exata
        if (seconds === conf.finalSeconds) {
            playFinishAlarm();
            document.body.classList.remove('warning-mode');
            document.body.classList.add('finish-mode');
            return;
        }

        // Alertas de Vertidas
        let isWarning = false;
        conf.targets.forEach(target => {
            const diff = target - seconds;
            if (diff >= 0 && diff <= 5) {
                isWarning = true;
                if (diff === 0) playBeep(2000, 0.4, 1.0); 
                else playBeep(3200, 0.12, 1.0); 
            }
        });

        if (isWarning) document.body.classList.add('warning-mode');
        else if (seconds < conf.finalSeconds) document.body.classList.remove('warning-mode');
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timer);
        document.getElementById('startBtn').innerText = "Retomar";
        document.getElementById('startBtn').classList.remove('active');
        document.body.classList.remove('warning-mode');
    }

    function resetTimer() {
        pauseTimer(); seconds = 0; updateDisplay();
        document.getElementById('startBtn').innerText = "Iniciar";
        document.body.classList.remove('finish-mode');
    }

    function updateDisplay() {
        const m = Math.floor(seconds / 60), s = seconds % 60;
        document.getElementById('display').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateDefaultRatio() {
        const m = document.getElementById('method').value;
        document.getElementById('ratio').value = CONFIG[m].defaultRatio;
        document.getElementById('results').style.display = 'none';
        resetTimer();
        onVolumeInput();
    }

    function roundBarista(g) {
        return g <= 30 ? Math.round(g * 2) / 2 : Math.round(g);
    }

    function formatCoffee(g) {
        return g % 1 === 0 ? String(g) : g.toFixed(1);
    }

    let lastEdited = 'volume'; // track which field was last edited

    function onVolumeInput() {
        lastEdited = 'volume';
        const vol = parseFloat(document.getElementById('volume').value);
        const ratio = parseFloat(document.getElementById('ratio').value);
        if (vol && ratio) {
            document.getElementById('coffee').value = formatCoffee(roundBarista(vol / ratio));
        }
    }

    function onCoffeeInput() {
        lastEdited = 'coffee';
        const coffee = parseFloat(document.getElementById('coffee').value);
        const ratio = parseFloat(document.getElementById('ratio').value);
        if (coffee && ratio) {
            document.getElementById('volume').value = Math.round(coffee * ratio);
        }
    }

    function onRatioInput() {
        if (lastEdited === 'coffee') {
            onCoffeeInput();
        } else {
            onVolumeInput();
        }
    }

    function calculate() {
        initAudio();
        const mKey = document.getElementById('method').value;
        const vol = parseFloat(document.getElementById('volume').value);
        const ratio = parseFloat(document.getElementById('ratio').value);
        if (!vol) return;
        const conf = CONFIG[mKey];
        const coffee = roundBarista(vol / ratio);
        document.getElementById('r-coffee').innerText = formatCoffee(coffee) + "g";
        document.getElementById('r-grind').innerText = conf.grind;
        document.getElementById('r-temp').innerText = conf.temp;
        document.getElementById('r-time').innerText = conf.time;
        document.getElementById('r-table').innerHTML = conf.getSteps(vol, coffee).map(s => `
            <tr><td>${s.t}</td><td class="val">${s.val} ml</td></tr>
        `).join('');
        document.getElementById('results').style.display = 'block';
        resetTimer();
    }

    function clearAll() {
        document.getElementById('volume').value = "";
        document.getElementById('coffee').value = "";
        updateDefaultRatio();
        document.getElementById('results').style.display = 'none';
        resetTimer();
    }
    window.onload = updateDefaultRatio;
</script>
</body>
</html>
